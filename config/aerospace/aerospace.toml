# Omaccy AeroSpace defaults. Hyper means Command+Control+Option.

config-version = 2
start-at-login = true
after-startup-command = ['exec-and-forget sketchybar --trigger aerospace_workspace_change']
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; ~/.config/aerospace/window-memory.sh record']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'
accordion-padding = 30

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# Focus moves when a window closes, which is the moment an application can stop
# living on a workspace. Nothing else tells us a window went away.
on-focus-changed = ['exec-and-forget ~/.config/aerospace/window-memory.sh record']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Layouts
# Period/comma are directly accessible on both QWERTY and QWERTZ. Using slash
# would collide with Hyper+Shift+7 (move window to workspace 7) on QWERTZ.
cmd-ctrl-alt-period = 'layout tiles horizontal vertical'
cmd-ctrl-alt-comma = 'layout accordion horizontal vertical'
cmd-ctrl-alt-shift-space = 'layout floating tiling'

# Temporarily switch between SketchyBar and the native macOS menu bar.
cmd-ctrl-alt-m = 'exec-and-forget ~/.config/sketchybar/plugins/menu-toggle.sh'

# Toggle automatic Dock hiding.
cmd-ctrl-alt-d = 'exec-and-forget ~/.config/aerospace/dock-toggle.sh'

# Focus windows like i3/vim.
cmd-ctrl-alt-h = 'focus left'
cmd-ctrl-alt-j = 'focus down'
cmd-ctrl-alt-k = 'focus up'
cmd-ctrl-alt-l = 'focus right'
cmd-ctrl-alt-left = 'focus left'
cmd-ctrl-alt-down = 'focus down'
cmd-ctrl-alt-up = 'focus up'
cmd-ctrl-alt-right = 'focus right'

# Move windows.
cmd-ctrl-alt-shift-h = 'move left'
cmd-ctrl-alt-shift-j = 'move down'
cmd-ctrl-alt-shift-k = 'move up'
cmd-ctrl-alt-shift-l = 'move right'
cmd-ctrl-alt-shift-left = 'move left'
cmd-ctrl-alt-shift-down = 'move down'
cmd-ctrl-alt-shift-up = 'move up'
cmd-ctrl-alt-shift-right = 'move right'

# Resize the focused window. U/I work on both QWERTY and QWERTZ.
cmd-ctrl-alt-u = 'resize smart -50'
cmd-ctrl-alt-i = 'resize smart +50'
cmd-ctrl-alt-minus = 'resize smart -50'
cmd-ctrl-alt-equal = 'resize smart +50'

# Switch workspaces.
cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'
cmd-ctrl-alt-6 = 'workspace 6'
cmd-ctrl-alt-7 = 'workspace 7'
cmd-ctrl-alt-8 = 'workspace 8'
cmd-ctrl-alt-9 = 'workspace 9'
cmd-ctrl-alt-tab = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin next'
cmd-ctrl-alt-shift-tab = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin prev'

# Move the focused window to a workspace and follow it.
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

# Send a new window back to the workspace that application was last seen in,
# so reopening Chrome puts it where Chrome lives rather than on top of whatever
# you are doing, and follow it there so you are not left hunting for the
# application you just opened. The mapping is learned from where you actually
# put your windows, never configured: move an app somewhere and that becomes
# its home. An application opened for the first time is left where it lands.
#
# This has to sit ABOVE the layout rule below, because AeroSpace stops at the
# first callback that matches and that rule matches nearly every window.
# check-further-callbacks lets it carry on, so the layout still gets applied.
# Delete this rule to have every window open wherever you are.
[[on-window-detected]]
if.during-aerospace-startup = false
check-further-callbacks = true
run = 'exec-and-forget ~/.config/aerospace/window-memory.sh place $AEROSPACE_WINDOW_ID'

# Re-assert the focused workspace's layout mode when a window appears. For the
# flat modes this only sets the root orientation and never moves a window, so
# unlike the master/stack placement it replaced, it cannot overwrite an
# arrangement made by hand. Only Grid is actually rebuilt.
[[on-window-detected]]
if.during-aerospace-startup = false
run = 'exec-and-forget ~/.config/aerospace/layout.sh apply'
