# Send Escape when Caps Lock is tapped without another key.
escape_on_tap = false

# Record what you copy so it can be browsed in the launcher. Entries stay in
# memory only unless clipboard_persist is on: a password copied from a password
# manager's *browser extension* is written by the browser and cannot be told
# apart from an ordinary copy, so it would be stored like any other text. The
# desktop apps of most managers mark their copies and are always skipped.
clipboard_history = true
clipboard_persist = false
clipboard_limit = 200

# Switch AeroSpace workspaces with a three-finger horizontal trackpad swipe.
# Install turns off the macOS "swipe between full-screen apps" gesture that
# owns the same swipe, so one swipe does not also move a macOS Space. Set
# trackpad_swipe_natural to false if you turned macOS natural scrolling off
# and the workspace goes the wrong way.
trackpad_swipe = true
trackpad_swipe_natural = true

# Layout mode of a workspace you have not picked one for in the menu bar:
# "horizontal" (Columns), "vertical" (Rows), "grid", or "accordion".
default_layout = "horizontal"

# Open Launchie with Command+Space instead of Spotlight. Off by default so
# Spotlight stays where you expect it; turn it on in the launcher's Settings.
# This sets Launchie's own shortcut to Command+Space and pauses Spotlight's
# while Omaccy Hyperkey runs. Turning it off, or uninstalling, puts Launchie's
# previous shortcut back and gives Command+Space to Spotlight again.
launchie_command_space = false

# Apps launched directly by their own Hyper chord, chosen in the launcher with
# ⌘Return. Hyper+A, Hyper+E, and Hyper+C launch these; add Shift to browse the
# collection instead. Unset means the chord opens the collection to pick one.
# default_agent = "claude-code"
# default_mail = "emzero"
# default_editor = "zed"

# Values are macOS application bundle identifiers. A binding launches a closed
# app or focuses its existing window across workspaces. A binding on a, c, or e
# takes that letter back from the collection above.
[bindings]
b = "com.google.Chrome"
f = "com.apple.finder"
r = "com.apple.reminders"
t = "com.mitchellh.ghostty"
